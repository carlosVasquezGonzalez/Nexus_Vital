name: CI/CD NexusVital

# Flujo: test -> (imagen Docker || provisión AWS) -> despliegue al Swarm -> prueba de humo por API Gateway
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nexus
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_USER: carlos0801
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  STACK_NAME: nexus

jobs:
  # ------------------------------------------------------------------ CI: build y test
  test:
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusvital_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/nexusvital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
  # ------------------------------------------------------------------ Imagen Docker (trazabilidad por SHA)
  build-push:
    name: Imagen (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ms-autenticacion, ms-busqueda, ms-documentos, ms-historial, ms-usuarios]
    steps:
      - uses: actions/checkout@v4
      - name: Calcular tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ matrix.service }}:${{ env.TAG }}
            ${{ env.DOCKERHUB_USER }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------ IE5: provisión de servicios cloud
  provision-aws:
    name: Provisión AWS (SQS, Lambda, API Gateway)
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    outputs:
      sqs_queue_url: ${{ steps.provision.outputs.sqs_queue_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar credenciales de AWS Academy
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error title=Credenciales AWS vencidas::Las credenciales de AWS Academy caducan al reiniciar el lab. Actualiza los Secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN y vuelve a ejecutar el workflow."
            exit 1
          fi
      - name: Provisionar servicios
        id: provision
        run: bash scripts/provision-aws.sh

  # ------------------------------------------------------------------ Despliegue al Swarm
  deploy:
    name: Deploy al Swarm
    needs: [build-push, provision-aws]
    runs-on: ubuntu-latest
    env:
      MANAGER_HOST: ${{ secrets.MANAGER_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      SQS_QUEUE_URL: ${{ needs.provision-aws.outputs.sqs_queue_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Calcular tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Fijar imágenes al SHA del commit
        run: |
          sed -i -E "s#(image: ${DOCKERHUB_USER}/ms-[a-z]+):latest#\1:${TAG}#" docker-compose.yml
          grep 'image:' docker-compose.yml

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/nexus.pem
          chmod 600 ~/.ssh/nexus.pem

      - name: Copiar stack al manager
        run: |
          SSH_OPTS="-i $HOME/.ssh/nexus.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "ec2-user@${MANAGER_HOST}" "mkdir -p ~/nexus-deploy"
          scp $SSH_OPTS docker-compose.yml "ec2-user@${MANAGER_HOST}:~/nexus-deploy/docker-compose.yml"

      - name: docker stack deploy
        run: |
          SSH_OPTS="-i $HOME/.ssh/nexus.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "ec2-user@${MANAGER_HOST}" "bash -s" <<EOF
          set -euo pipefail
          export MYSQL_ROOT_PASSWORD='${MYSQL_ROOT_PASSWORD}'
          export SQS_QUEUE_URL='${SQS_QUEUE_URL}'
          docker stack deploy -c ~/nexus-deploy/docker-compose.yml --prune ${STACK_NAME}
          EOF

      - name: Esperar a que los servicios converjan
        run: |
          SSH_OPTS="-i $HOME/.ssh/nexus.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "ec2-user@${MANAGER_HOST}" "bash -s" <<'EOF'
          for i in $(seq 1 36); do
            pending=$(docker stack services nexus --format '{{.Replicas}}' | awk -F'[/ ]' '$1!=$2' | wc -l)
            if [ "$pending" -eq 0 ]; then
              echo "Todos los servicios convergieron"
              docker stack services nexus
              exit 0
            fi
            echo "Esperando convergencia ($i/36)..."
            sleep 10
          done
          docker stack ps nexus --filter desired-state=running | head -20
          exit 1
          EOF

  # ------------------------------------------------------------------ Verificación end-to-end por el Gateway
  verify:
    name: Prueba de humo (API Gateway)
    needs: deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Validar credenciales de AWS Academy
        run: |
          aws sts get-caller-identity >/dev/null || {
            echo "::error title=Credenciales AWS vencidas::Actualiza AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN en los Secrets."
            exit 1
          }
      - name: Probar el sistema a través del API Gateway
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='nexus-api'].id | [0]" --output text)
          URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/prod/api/usuarios"
          KEY_ID=$(aws apigateway get-api-keys --query "items[?name=='nexus-key'].id | [0]" --output text)
          KEY=$(aws apigateway get-api-key --api-key "$KEY_ID" --include-value --query value --output text)
          echo "::add-mask::$KEY"

          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          echo "Sin API key -> HTTP $code (esperado 403)"
          [ "$code" = "403" ] || { echo "::error::El Gateway no bloquea peticiones sin key"; exit 1; }

          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $KEY" "$URL")
            echo "Con API key -> HTTP $code (intento $i/12)"
            [ "$code" = "200" ] && { echo "Sistema operativo detrás del Gateway"; exit 0; }
            sleep 15
          done
          echo "::error::El backend no respondió 200 a través del Gateway (revisa IP del manager en la integración y security group)"
          exit 1
